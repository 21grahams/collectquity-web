<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw under the iPhone notch; the shell pads with safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0F11" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)" />
    <script>
      // Pick light or dark before the app loads, so the page never flashes the wrong one.
      try {
        var m = localStorage.getItem('collectquity-mode') || 'system';
        if (m === 'system') m = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', m);
        // The home-screen app picks its status bar style at launch: dark text over light mode.
        var bar = document.createElement('meta');
        bar.name = 'apple-mobile-web-app-status-bar-style';
        bar.content = m === 'light' ? 'default' : 'black-translucent';
        document.head.appendChild(bar);
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%APP_NAME%" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" />
    <title>%APP_NAME% · %TAGLINE%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
